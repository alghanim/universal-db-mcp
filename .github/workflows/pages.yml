# Publishes the landing page in site/ to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Actions are pinned to full commit SHAs, with the release in the trailing
# comment; Dependabot proposes updates to both. The token gets no permission
# by default. The build job only reads; the deploy job, which runs
# deploy-pages alone, is the only one that may write to Pages and request an
# OIDC token.
name: Landing page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out site/
      pages: read # configure-pages reads the Pages URL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Point the page at this repository and its Pages URL
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sed -i "s#__REPO_URL__#${REPO_URL}#g; s#__SITE_URL__#${SITE_URL}#g" site/index.html
          if grep -n "__REPO_URL__\|__SITE_URL__" site/index.html; then
            echo "placeholders left in site/index.html" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the artifact the build job uploaded
      id-token: write # prove to Pages that this workflow run made it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
