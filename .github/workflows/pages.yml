# Publishes the landing page in site/ to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Landing page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Point the page at this repository and its Pages URL
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sed -i "s#__REPO_URL__#${REPO_URL}#g; s#__SITE_URL__#${SITE_URL}#g" site/index.html
          if grep -n "__REPO_URL__\|__SITE_URL__" site/index.html; then
            echo "placeholders left in site/index.html" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
