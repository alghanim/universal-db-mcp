# A weekly vulnerability audit of everything CI installs from uv.lock, CI's
# pip and every lock the offline bundle ships: CI's own audit step (the same
# pinned pip-audit, inputs and options, which a CI hygiene test keeps equal)
# runs only on a push or a pull request, so a new advisory against a pinned
# version would otherwise wait for the next commit. A failed scheduled run
# notifies the maintainers; it can also be run by hand. GitHub disables a
# schedule after 60 days without repository activity.
name: Weekly audit

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          checksum: "74947fe2c03315cf07e82ab3acc703eddef01aba4d5232a98e4c6825ec116131"
          python-version: "3.12"
          enable-cache: false

      - name: Audit the dependencies
        run: |
          uv export --locked --no-emit-project --format requirements-txt --all-extras \
            > "$RUNNER_TEMP/ci-requirements.txt"
          for requirements in "$RUNNER_TEMP/ci-requirements.txt" .github/ci-pip-requirements.txt \
            requirements/locks/*.txt; do
            uvx --from pip-audit==2.10.1 --exclude-newer 2026-09-27T00:00:00Z \
              pip-audit --strict --require-hashes --disable-pip -r "$requirements"
          done
