# OpenSSF Scorecard: an independent check of the repository's security
# practices (branch protection, pinned dependencies, token permissions, signed
# releases and more), published to scorecard.dev and shown in the repository's
# code-scanning results. publish_results needs an OIDC token; the SARIF upload
# needs security-events. The CI hygiene test allows exactly these writes for
# this job, on these triggers only (a push to main, never a pull request), and
# Scorecard's own publishing rules allow no run steps in it.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "33 6 * * 1" # Mondays, 06:33 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
