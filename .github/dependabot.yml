# Monthly update proposals. Each one arrives as a pull request and so runs CI
# (tests, lint, types and the dependency audit) before anyone merges it.
# Each ecosystem's updates arrive grouped in one pull request a month. A
# vulnerability in a pinned version does not wait for it: the weekly audit
# (.github/workflows/audit.yml) fails on a new advisory between commits.
#
# A runtime bump needs the hashed per-platform locks refreshed, which
# Dependabot cannot do: CI's lock check stays red on it until someone runs
# 'python scripts/prepare_offline_bundle.py --refresh-locks', re-locks uv.lock
# to the same versions, reviews the hash diff and commits all of it to the
# pull request (docs/offline-build.md).
#
# The ignore lists mirror pyproject.toml's caps (the next major, or a reviewed
# series; tests/unit/test_hardening_2026_09_27_ci_hygiene.py keeps the two in
# step): moving past a cap is a review, not a weekly bump. pip-audit still
# fails CI on a known vulnerability in any pinned version.
version: 2
updates:
  # pyproject.toml, requirements/*.in and uv.lock, which CI installs from.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
    ignore:
      # a major release past pyproject.toml's cap
      - dependency-name: "mcp"
        versions: [">=3"]
      - dependency-name: "pyyaml"
        versions: [">=7"]
      - dependency-name: "psycopg"
        versions: [">=4"]
      - dependency-name: "pymysql"
        versions: [">=2"]
      - dependency-name: "oracledb"
        versions: [">=5"]
      - dependency-name: "pyodbc"
        versions: [">=6"]
      # the HTTP transport subclasses uvicorn's h11 protocol and reads h11 state
      - dependency-name: "uvicorn"
        versions: [">=0.54"]
      - dependency-name: "h11"
        versions: [">=0.17"]
      # the SQL guard and masking are reviewed on this sqlglot series
      - dependency-name: "sqlglot"
        versions: [">=30.19"]
      # the stream-budget meter wraps a clickhouse-connect 1.8 seam
      - dependency-name: "clickhouse-connect"
        versions: [">=1.9"]
      # 3.3.0 ships manylinux_2_34 Linux wheels only: taking it raises the
      # bundle's glibc floor from 2.17 to 2.34, a support decision
      - dependency-name: "ibm-db"
        versions: [">=3.3"]

  # The hashed per-platform locks the offline bundle ships (requirements/locks).
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "monthly"
    groups:
      bundle-locks:
        patterns: ["*"]
    ignore:
      # a major release past pyproject.toml's cap
      - dependency-name: "mcp"
        versions: [">=3"]
      - dependency-name: "pyyaml"
        versions: [">=7"]
      - dependency-name: "psycopg"
        versions: [">=4"]
      - dependency-name: "pymysql"
        versions: [">=2"]
      - dependency-name: "oracledb"
        versions: [">=5"]
      - dependency-name: "pyodbc"
        versions: [">=6"]
      # the HTTP transport subclasses uvicorn's h11 protocol and reads h11 state
      - dependency-name: "uvicorn"
        versions: [">=0.54"]
      - dependency-name: "h11"
        versions: [">=0.17"]
      # the SQL guard and masking are reviewed on this sqlglot series
      - dependency-name: "sqlglot"
        versions: [">=30.19"]
      # the stream-budget meter wraps a clickhouse-connect 1.8 seam
      - dependency-name: "clickhouse-connect"
        versions: [">=1.9"]
      # 3.3.0 ships manylinux_2_34 Linux wheels only: taking it raises the
      # bundle's glibc floor from 2.17 to 2.34, a support decision
      - dependency-name: "ibm-db"
        versions: [">=3.3"]

  # The hashed pip CI installs into its venv (.github/ci-pip-requirements.txt).
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "monthly"

  # The digest-pinned Ubuntu base in packaging/Dockerfile: a pinned base also
  # freezes its OS packages, so new digests are proposed like everything else.
  - package-ecosystem: "docker"
    directory: "/packaging"
    schedule:
      interval: "monthly"

  # The commit-SHA pins in .github/workflows, with their version comments.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
