# newsyslog(8) rotation for the Universal DB MCP launchd daemon logs.
#
# com.udbmcp.server.plist points StandardOutPath/StandardErrorPath at
# /var/log/universal-db-mcp/server.log and server.err.log; launchd never
# rotates them. packaging/pkg/postinstall installs this file (best-effort) at
# /etc/newsyslog.d/udbmcp.conf, where the system newsyslog job picks it up.
#
# Fields: logfilename owner:group mode count size(KB) when flags
#   G  logfilename is a glob pattern (required for the *.log match)
#   J  compress rotated files with bzip2
#   size 10240 KB, 7 archives kept, no time-based schedule (*)
# Owner/group match the log directory postinstall provisions (0750
# _udbmcp:_udbmcp). Note: launchd opens the log files once at spawn, so the
# daemon keeps writing to the rotated (renamed) file until its next restart.
/var/log/universal-db-mcp/*.log	_udbmcp:_udbmcp	640	7	10240	*	GJ
