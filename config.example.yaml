# Example configuration for universal-db-mcp.
# Copy to /etc/universal-db-mcp/config.yaml and edit for your deployment.
# All addresses/paths here are examples, not real infrastructure.
#
# Schema rules: unknown fields are rejected; secrets are referenced, never
# inlined (username_env / password_env / password_file).

application:
  airgapped: true
  transport: stdio            # stdio | http
  metadata_cache_path: /var/lib/universal-db-mcp/metadata.sqlite
  audit_path: /var/log/universal-db-mcp/audit.jsonl
  audit_max_bytes: 52428800   # rotate at 50 MiB
  audit_max_backups: 5
  audit_fail_closed: true     # refuse operations if the audit write fails
  telemetry_enabled: false    # must remain false; this build has no telemetry
  # HTTP transport only (stdio ignores these):
  # This value is BOTH the bind address and the Host header the transport
  # accepts: with 127.0.0.1 a client connecting by hostname (or a proxy that
  # forwards the original Host) is answered 421 Invalid Host header. A
  # container must set 0.0.0.0, otherwise the published port reaches nothing.
  http_host: "127.0.0.1"      # restrictive default; put an internal reverse
                              # proxy in front for shared deployments
  http_port: 8765
  # http_bearer_token_file: /run/secrets/udbmcp_http_token

security:
  read_only: true
  allow_write_operations: false   # cannot be true in v1
  default_max_rows: 1000
  hard_max_rows: 10000
  max_response_bytes: 1048576
  max_cell_bytes: 8192
  default_query_timeout_seconds: 30
  hard_query_timeout_seconds: 60
  max_concurrent_queries: 4
  require_remote_tls: true
  default_deny_objects: true
  allowed_system_schemas: [information_schema]
  sample_limit: 20
  audit_sql_text: false
  audit_parameter_values: false
  audit_result_rows: false
  allow_explain_analyze: false
  # mask_columns: EXTRA regex patterns, ADDED to (merged with) the built-in
  # default list — the built-ins cannot be removed here. Built-in defaults
  # (case-insensitive, token-boundary anchored so short tokens do not
  # substring-match ordinary names such as company_name or span_ms):
  #   (?i)(?<![a-z0-9])(password|passwd|pwd|secret|token|api_?key|access_key|private_key)(?![a-z0-9])
  #   (?i)(?<![a-z0-9])(ssn|social_security|tax_id|national_id|credit_card|card_number|cvv|pan)(?![a-z0-9])
  # Example extra pattern:
  # mask_columns:
  #   - "(?i)salary"
  # allowed_schemas (per connection, below): an EMPTY list [] is NOT deny-all.
  # It imposes no schema restriction — every schema the account can see is
  # listable and queryable. Always name the schemas to expose.
  mask_action: mask              # mask | omit

connections:
  # Always-available local reference (works with the demo fixture):
  demo_sqlite:
    type: sqlite
    database: /var/lib/universal-db-mcp/demo/finlink_demo.db
    read_only: true

  # IBM Db2 (LUW) example — requires ibm-db wheel from the bundle wheelhouse
  # and Db2 Connect / client licensing as an administrator prerequisite:
  # finance_db2:
  #   type: db2
  #   family: luw
  #   host: db2.internal.example
  #   port: 50001
  #   database: FINANCE
  #   username_env: FINANCE_DB2_USER
  #   password_file: /run/secrets/finance_db2_password
  #   tls:
  #     enabled: true
  #     verify_server: true
  #     ca_file: /etc/universal-db-mcp/certs/internal-ca.pem
  #   allowed_schemas: [REPORTING]
  #   read_only: true

  # Engine-specific options (all optional; each is refused unless the engine
  # actually consumes it). Added 2026-09-15 for deployments that no plain
  # host/port/database connection can express:
  #
  #   oracle:
  #     thick_mode: true          # Instant Client; the only client-side way to
  #     lib_dir: /opt/oracle/instantclient_23_5   # reach a 10G-verifier account
  #                               # (on Linux prefer ldconfig and omit lib_dir)
  #     sid: ORCL                 # pre-12c databases that register a SID
  #     tns_alias: PRODDB         # entry in tnsnames.ora (needs tns_admin)
  #     tns_admin: /etc/universal-db-mcp/tns
  #     wallet_location: /etc/universal-db-mcp/oracle-wallet   # with tls.enabled
  #     wallet_password: ...      # only for a password-protected wallet
  #   mssql:
  #     trusted_connection: true  # Windows/Kerberos identity; no username/password
  #     odbc_driver: ODBC Driver 18 for SQL Server
  #   db2:
  #     authentication: SERVER_ENCRYPT_AES   # or SERVER, KERBEROS, GSSPLUGIN,
  #                                          # TOKEN, CERTIFICATE
  #   postgres:
  #     gssencmode: require       # Kerberos/GSSAPI deployments
  #     krbsrvname: postgres
  #     service: prod             # libpq service file entry
  #     sslmode: disable          # only when tls.enabled is false
  #   mysql:
  #     unix_socket: /var/run/mysqld/mysqld.sock   # co-located server, no TCP
  #   postgres / mysql / clickhouse:
  #     os_authentication: true   # deliberately use the driver's implicit
  #                               # identity (OS user, or 'default' on
  #                               # clickhouse) instead of a configured username

  # PostgreSQL example:
  # analytics_pg:
  #   type: postgres
  #   host: pg.internal.example
  #   port: 5432
  #   database: analytics
  #   username_env: ANALYTICS_PG_USER
  #   password_file: /run/secrets/analytics_pg_password
  #   tls:
  #     enabled: true
  #     verify_server: true
  #     ca_file: /etc/universal-db-mcp/certs/internal-ca.pem
  #   allowed_schemas: [public]
  #   read_only: true
