# Scale evidence config (staging only): the local PostgreSQL fixture's
# `scaledb` database, 2,000 narrow tables + a 900-column table + a
# 2,000,000-row table in schema `scale`. Read-only account, default policy.
# Paths are relative to this file's directory, the repository root.
application:
  airgapped: true
  transport: stdio
  metadata_cache_path: out/mockdb-state/metadata-scale.sqlite
  audit_path: out/mockdb-state/audit-scale.jsonl
  audit_fail_closed: true
  telemetry_enabled: false
security:
  read_only: true
  default_max_rows: 1000
  hard_max_rows: 10000
  max_response_bytes: 1048576
  max_cell_bytes: 8192
  default_query_timeout_seconds: 30
  hard_query_timeout_seconds: 60
  require_remote_tls: false      # loopback fixture
  default_deny_objects: true
  allowed_system_schemas: [information_schema]
  sample_limit: 20
  allow_explain_analyze: false
  mask_action: mask
connections:
  scale_pg:
    type: postgres
    host: 127.0.0.1
    port: 5433
    database: scaledb
    username_env: UDBMCP_DEMO_PG_USER
    password_file: out/mockdb-secrets/pg.pw
    read_only: true
    allowed_schemas: [scale]
